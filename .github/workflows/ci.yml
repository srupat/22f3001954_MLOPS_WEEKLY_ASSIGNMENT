name: Week 5 CI - IRIS MLflow Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  test-mlflow-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[gs]" mlflow pytest

      - name: Pull DVC data only
        run: |
          dvc remote list
          dvc pull data.dvc

      - name: Train and register model with MLflow
        run: |
          python src/mlflow_train.py

      - name: Evaluate registered MLflow model
        run: |
          python src/mlflow_evaluate.py

      - name: Run pytest suite
        run: |
          set -o pipefail
          mkdir -p reports
          pytest tests -v | tee reports/pytest_report.txt

      - name: Create CML report
        if: always()
        run: |
          echo "## Week 5 MLflow CI Report" > reports/cml_report.md
          echo "" >> reports/cml_report.md

          echo "### Pytest Output" >> reports/cml_report.md
          echo '```text' >> reports/cml_report.md
          cat reports/pytest_report.txt >> reports/cml_report.md || true
          echo '```' >> reports/cml_report.md

          echo "" >> reports/cml_report.md
          echo "### MLflow Evaluation Metrics" >> reports/cml_report.md
          if [ -f outputs/mlflow_eval_metrics.json ]; then
            echo '```json' >> reports/cml_report.md
            cat outputs/mlflow_eval_metrics.json >> reports/cml_report.md
            echo '```' >> reports/cml_report.md
          else
            echo "No MLflow evaluation metrics generated." >> reports/cml_report.md
          fi

      - name: Set up CML
        if: always() && github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2

      - name: Comment CML report on PR
        if: always() && github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create reports/cml_report.md
